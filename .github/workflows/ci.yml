name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Testes e validações
    runs-on: ubuntu-latest
      
    env:
      STOCKFLOW_SECRET_KEY: chave-apenas-para-testes-do-ci

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar compilação do Python
        run: |
          python -m compileall -q \
            app \
            tests \
            config.py \
            init_db.py \
            create_admin.py \
            run.py

      - name: Verificar problemas básicos no diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          fi

      - name: Diagnóstico do código executado
        run: |
          git rev-parse HEAD
          git show -s --format='%H %s' HEAD
          python -c "import flask; print(flask.__version__)"
          test -n "$STOCKFLOW_SECRET_KEY" && echo "STOCKFLOW_SECRET_KEY configurada" || exit 1


      - name: Executar testes automatizados
        run: pytest -q
