{% extends "base.html" %}

{% block title %}
    Editar usuário | StockFlow
{% endblock %}

{% block content %}

<h1>Editar usuário</h1>

{% if erro %}
    <p>{{ erro }}</p>
{% endif %}

<form method="POST">

    <div>
        <label for="nome">
            Nome
        </label>

        <input
            type="text"
            id="nome"
            name="nome"
            value="{{ nome or '' }}"
            required
        >
    </div>

    <div>
        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            value="{{ username or '' }}"
            required
        >
    </div>

    <div>
        <label for="perfil">
            Perfil
        </label>

        <select
            id="perfil"
            name="perfil"
            required
        >
            <option
                value="COMUM"
                {% if perfil == "COMUM" %}
                    selected
                {% endif %}
            >
                Comum
            </option>

            <option
                value="ADMIN"
                {% if perfil == "ADMIN" %}
                    selected
                {% endif %}
            >
                Administrador
            </option>

            <option
                value="DEMO"
                {% if perfil == "DEMO" %}
                    selected
                {% endif %}
            >
                Demonstração
            </option>
        </select>
    </div>

    <p>
        A senha não é alterada nesta tela.
    </p>

    <button type="submit">
        Salvar alterações
    </button>

</form>

<p>
    <a href="{{ url_for('usuarios.index') }}">
        Voltar para usuários
    </a>
</p>

{% endblock %}
