{% extends "base.html" %}

{% block title %}Novo produto | StockFlow{% endblock %}

{% block content %}

<h1>Cadastrar produto</h1>

{% if erro %}
    <p>{{ erro }}</p>
{% endif %}

<form method="POST">

    <div>
        <label for="codigo">Código</label>
        <input
            type="text"
            id="codigo"
            name="codigo"
            value="{{ codigo or '' }}"
            required
        >
    </div>

    <div>
        <label for="nome">Nome</label>
        <input
            type="text"
            id="nome"
            name="nome"
            value="{{ nome or '' }}"
            required
        >
    </div>

    <div>
        <label for="descricao">Descrição</label>
        <textarea
            id="descricao"
            name="descricao"
            rows="4"
        >{{ descricao or '' }}</textarea>
    </div>

    <div>
        <label for="categoria">Categoria</label>
        <input
            type="text"
            id="categoria"
            name="categoria"
            value="{{ categoria or '' }}"
        >
    </div>

    <div>
        <label for="quantidade_inicial">
            Quantidade inicial
        </label>

        <input
            type="number"
            id="quantidade_inicial"
            name="quantidade_inicial"
            min="0"
            value="{{ quantidade_inicial or 0 }}"
            required
        >
    </div>

    <div>
        <label for="estoque_minimo">
            Estoque mínimo
        </label>

        <input
            type="number"
            id="estoque_minimo"
            name="estoque_minimo"
            min="0"
            value="{{ estoque_minimo or 0 }}"
            required
        >
    </div>

    <div>
        <label for="preco">Preço</label>

        <input
            type="number"
            id="preco"
            name="preco"
            min="0"
            step="0.01"
            value="{{ preco or '' }}"
            required
        >
    </div>

    <button type="submit">
        Cadastrar produto
    </button>

</form>

<p>
    <a href="{{ url_for('produtos.index') }}">
        Voltar para produtos
    </a>
</p>

{% endblock %}
