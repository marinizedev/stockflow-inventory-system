{% extends "base.html" %}

{% block title %}
    Login | StockFlow
{% endblock %}

{% block content %}

<h1>Entrar no StockFlow</h1>

<p>
    Acesse sua conta para continuar.
</p>

{% if erro %}
    <p>{{ erro }}</p>
{% endif %}

<form method="POST">

    <div>
        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            required
            autofocus
        >
    </div>

    <div>
        <label for="senha">
            Senha
        </label>

        <input
            type="password"
            id="senha"
            name="senha"
            required
        >
    </div>

    <button type="submit">
        Entrar
    </button>

</form>

{% endblock %}
